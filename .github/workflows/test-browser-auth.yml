name: Test NOX authentication and guard policy

on:
  push:
    branches:
      - feature/all-ages-optional-dob
      - feature/open-registration-implementation
    paths:
      - "core/auth-client.js"
      - "core/appwrite-config.js"
      - "server/nox-guard/**"
      - "tests/auth-client.test.js"
      - "tests/nox-guard-policy.test.js"
      - "tests/nox-guard-appwrite-function.test.js"
      - "tests/registration-age-policy.test.js"
      - "signup.html"
      - "core/auth-guard.js"
      - "functions/registration/**"
      - "functions/moderation/src/index.js"
      - "functions/moderation/src/policy.js"
      - "functions/moderation/test/policy.test.js"
      - "tests/registration-age-policy.test.js"
      - "signup.html"
      - ".github/workflows/test-browser-auth.yml"
  pull_request:
    paths:
      - "core/auth-client.js"
      - "core/appwrite-config.js"
      - "server/nox-guard/**"
      - "tests/auth-client.test.js"
      - "tests/nox-guard-policy.test.js"
      - "tests/nox-guard-appwrite-function.test.js"
      - ".github/workflows/test-browser-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-and-guard-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Appwrite SDK for function tests
        run: npm install --no-save --package-lock=false node-appwrite@31.3.0
      - name: Install registration function dependencies
        run: npm --prefix functions/registration install --ignore-scripts --no-audit --no-fund
      - name: Run authentication, registration and NOX GUARD tests
        run: node --check core/auth-client.js && npm --prefix functions/registration test && npm --prefix functions/registration run check && node --test tests/auth-client.test.js tests/nox-guard-policy.test.js tests/nox-guard-appwrite-function.test.js tests/registration-age-policy.test.js
