name: Test NOX browser authentication client

on:
  push:
    branches:
      - feature/auth-login-staging
    paths:
      - "core/auth-client.js"
      - "core/appwrite-config.js"
      - "tests/auth-client.test.js"
      - ".github/workflows/test-browser-auth.yml"
  pull_request:
    paths:
      - "core/auth-client.js"
      - "core/appwrite-config.js"
      - "tests/auth-client.test.js"
      - ".github/workflows/test-browser-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-auth-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run browser authentication client unit tests
        run: node --test tests/auth-client.test.js
