name: Test NOX moderation scaffold

on:
  push:
    branches:
      - main
      - feature/moderation-functions-scaffold
    paths:
      - "functions/moderation/**"
      - ".github/workflows/test-moderation.yml"
  pull_request:
    paths:
      - "functions/moderation/**"
      - ".github/workflows/test-moderation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moderation-policy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/moderation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run unit and SDK compatibility tests
        run: npm test && npm run check
