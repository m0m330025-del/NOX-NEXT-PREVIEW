name: Test NOX moderation scaffold

on:
  push:
    branches:
      - main
      - feature/moderation-functions-scaffold
    paths:
      - "index.js"
      - "package.json"
      - "functions/moderation/**"
      - ".github/workflows/test-moderation.yml"
  pull_request:
    paths:
      - "index.js"
      - "package.json"
      - "functions/moderation/**"
      - ".github/workflows/test-moderation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moderation-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Appwrite Function root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Appwrite Function root entrypoint
        run: node --check index.js
      - name: Install moderation test dependencies
        run: npm --prefix functions/moderation install --ignore-scripts --no-audit --no-fund
      - name: Run moderation unit and SDK compatibility tests
        run: npm --prefix functions/moderation test && npm --prefix functions/moderation run check
