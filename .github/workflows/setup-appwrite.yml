name: Setup Appwrite NOX_CORE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-appwrite-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secret
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        shell: bash
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "::error::Missing repository secret APPWRITE_API_KEY. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install pinned Appwrite SDK
        run: npm install --no-save --package-lock=false node-appwrite@31.3.0

      - name: Create NOX_CORE database and collections
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6af9ca51000735dfb692
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/setup-appwrite.mjs
